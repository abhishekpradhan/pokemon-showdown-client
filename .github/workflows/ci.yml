name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly live-protocol check: handshake drift shows up here first.
    - cron: '20 6 * * *'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22.x

jobs:
  check:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Report bundle size
        run: |
          echo '### Bundle' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '| Asset | Raw | Gzip |' >> "$GITHUB_STEP_SUMMARY"
          echo '| --- | ---: | ---: |' >> "$GITHUB_STEP_SUMMARY"
          for f in dist/assets/*.js dist/assets/*.css; do
            raw=$(wc -c < "$f")
            gz=$(gzip -c "$f" | wc -c)
            printf '| `%s` | %s kB | %s kB |\n' \
              "$(basename "$f")" \
              "$(awk "BEGIN{printf \"%.1f\", $raw/1024}")" \
              "$(awk "BEGIN{printf \"%.1f\", $gz/1024}")" >> "$GITHUB_STEP_SUMMARY"
          done

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Visual baselines are committed per-platform; only assert them on the
      # platform they were generated for.
      - run: npm run test:e2e -- --project=chromium --grep-invert "visual baseline"
      - name: Accessibility audit
        run: npm run test:e2e -- --project=chromium e2e/a11y.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  live:
    name: Live protocol smoke
    runs-on: ubuntu-latest
    # Talks to the public Showdown server, so keep it off pull requests from
    # forks. Non-blocking: a PS outage must not gate merges.
    if: github.event_name != 'pull_request'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test:live
        env:
          LIVE_PS_TESTS: '1'
