name: Bug report
description: Something in the client is broken or behaves wrongly
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Build revision
      description: From Settings → About, or /build-info.json on the deployment you used.
      placeholder: 1.2.0 (440cccc1)
  - type: input
    id: server
    attributes:
      label: Server
      description: Which server were you connected to?
      placeholder: sim3.psim.us (default)
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Firefox 141 on macOS 15
  - type: textarea
    id: protocol
    attributes:
      label: Protocol log (if battle-related)
      description: >
        Use the share-safe export in Settings and review it before posting. Never
        post raw private messages, teams, tokens, or private replay URLs.
      render: text
