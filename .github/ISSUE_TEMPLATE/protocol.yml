name: Protocol compatibility
description: The client mishandles or ignores something a PS server sends
labels: [compatibility]
body:
  - type: textarea
    id: lines
    attributes:
      label: Protocol lines involved
      description: Use a reviewed share-safe export or public replay log. Remove credentials, private messages, unrevealed teams and private replay URLs; include the build revision.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What the official client does with them
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What this client does
    validations:
      required: true
